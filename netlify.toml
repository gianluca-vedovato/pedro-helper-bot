[functions]
  # Usa direttamente la sorgente TypeScript; Netlify compila con esbuild
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build]
  # Nessun build custom necessario per le Functions; esbuild gestisce TS automaticamente
  publish = "public"

[functions."telegram-webhook"]
  node_bundler = "esbuild"

[functions."telegram-webhook-local"]
  node_bundler = "esbuild"

[functions."rules-list"]
  node_bundler = "esbuild"

[functions."formazioni-check"]
  node_bundler = "esbuild"
  # Ogni 15 minuti: controlla se è passata un'ora dal primo match di una giornata di Serie A non ancora verificata
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/regole"
  to = "/.netlify/functions/rules-list"
  status = 200


